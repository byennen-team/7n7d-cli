name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: 'true'
        type: boolean

# Only runs that will actually publish (the same condition as the "Publish to npm"
# step) share the npm-publish group, so two can't race to publish one version.
# Every other run (dry runs, releases not targeting main) gets a per-run group,
# so it never queues behind, or displaces, a pending publish.
concurrency:
  group: ${{ ((github.event_name == 'release' && github.event.release.target_commitish == 'main') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false && github.ref == 'refs/heads/main')) && 'npm-publish' || format('npm-no-publish-{0}', github.run_id) }}
  cancel-in-progress: false

# Deny by default; the publish job grants only what it needs.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance

    steps:
      # The CLI depends on "@7n7d/sdk": "file:../7n7d-sdk". The SDK is
      # checked out as a sibling directory at a pinned revision and built
      # first, so the test step resolves the real package.
      - name: Checkout CLI
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          path: cli

      - name: Checkout SDK (sibling)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: byennen-team/7n7d-sdk
          ref: bd7eb3d7e82a177e8e4999170cb88084608c0c77
          persist-credentials: false
          path: 7n7d-sdk

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          # No dependency cache in the release workflow: a cache written by an untrusted
          # run could be restored here and end up in the published package.

      - name: Install SDK dependencies
        working-directory: 7n7d-sdk
        run: npm ci --no-audit --no-fund

      - name: Build SDK
        working-directory: 7n7d-sdk
        run: npm run build

      - name: Install dependencies
        working-directory: cli
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: cli
        run: npm run typecheck

      # No --if-present: publishing must not ship a package whose test gate
      # never ran.
      - name: Test
        working-directory: cli
        run: npm run test:coverage

      - name: Build
        working-directory: cli
        run: npm run build

      - name: Publish to npm
        working-directory: cli
        if: ${{ (github.event_name == 'release' && github.event.release.target_commitish == 'main') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false && github.ref == 'refs/heads/main') }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run publish
        working-directory: cli
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: npm publish --access public --dry-run
